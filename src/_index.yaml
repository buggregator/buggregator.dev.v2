version: "1.0"
namespace: app

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: App Template
      description: Reusable application template with MCP scaffold and Temporal workflows

  # ── Database ────────────────────────────────────────────────
  # SQLite file on the app-data volume (/app/data in the image), so stored
  # state survives restarts and deploys. Tables: src/migrations.
  - name: db
    kind: db.sql.sqlite
    file: "./data/app.db"
    lifecycle:
      auto_start: true

  # ── Stores ──────────────────────────────────────────────────
  # Key/value state (GitHub caches, the «Growing every day» stats history).
  # Kept in app:db, not in memory: a restart used to empty the history.
  - name: state_store
    kind: store.sql
    database: app:db
    table_name: state_store
    id_column_name: key
    payload_column_name: value
    expire_column_name: expires_at
    cleanup_interval: "10m"
    lifecycle:
      auto_start: true
      depends_on:
        - app:db

  # ── Temporal (disabled — no workflows yet) ──────────────────
  # - name: temporal_client
  #   kind: temporal.client
  #   address: "temporal:7233"
  #   namespace: "default"
  #   lifecycle:
  #     auto_start: true

  # - name: temporal_worker
  #   kind: temporal.worker
  #   client: app:temporal_client
  #   task_queue: "app-tasks"
  #   lifecycle:
  #     auto_start: true
  #     depends_on:
  #       - app:temporal_client

  # ── Process Host ────────────────────────────────────────────
  - name: processes
    kind: process.host
    host:
      workers: 4
    lifecycle:
      auto_start: true

  # ── Exec ────────────────────────────────────────────────────
  - name: shell
    kind: exec.native

  # ── Terminal Host ──────────────────────────────────────────
  - name: terminal
    kind: terminal.host
    lifecycle:
      auto_start: true

  # ── HTTP Server ─────────────────────────────────────────────
  - name: gateway
    kind: http.service
    addr: ":8080"
    lifecycle:
      auto_start: true
